openapi: 3.0.1
info:
  title: Desconfie · IA & ML
  description: >-
    Probabilidade de golpe em mensagens e de phishing em links. Quem chama é a
    API Java; o veredito final é dela, não desta API. Campos de texto aceitam no
    máximo 5000 caracteres.
  version: 1.0.0-oas3
servers:
  - url: /
tags:
  - name: Status
  - name: Previsão
paths:
  /:
    get:
      tags:
        - Status
      summary: Índice da API (rotas e limites)
      responses:
        '200':
          description: Índice
          content: {}
  /health:
    get:
      tags:
        - Status
      summary: Status e versão dos modelos
      responses:
        '200':
          description: Serviço no ar
          content: {}
  /prever/texto:
    post:
      tags:
        - Previsão
      summary: Probabilidade de uma mensagem ser golpe
      responses:
        '200':
          description: Previsão do modelo de texto
          content: {}
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /prever/url:
    post:
      tags:
        - Previsão
      summary: Probabilidade de um link ser phishing
      responses:
        '200':
          description: Previsão do modelo de URL
          content: {}
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '500':
          $ref: '#/components/responses/ErroInterno'
components: {}
x-original-swagger-version: '2.0'