openapi: 3.0.3
info:
  title: Desconfie · IA & ML
  version: 1.0.0
  description: >-
    Probabilidade de golpe em mensagens e de phishing em links.
    Quem chama é a API Java; o veredito final é dela, não desta API.
    Campos de texto aceitam no máximo 5000 caracteres.

servers:
  - url: /
    description: Este servidor
  - url: https://{servico}.onrender.com
    description: Render
    variables:
      servico:
        default: iachatbot-desconife-2sem
  - url: http://localhost:5000
    description: Local

tags:
  - name: Status
  - name: Previsão

paths:
  /:
    get:
      tags: [Status]
      summary: Índice da API (rotas e limites)
      responses:
        '200':
          description: Índice
          content:
            application/json:
              schema:
                type: object
                properties:
                  api: { type: string, example: Desconfie · IA & ML }
                  descricao: { type: string }
                  rotas:
                    type: object
                    additionalProperties: { type: string }
                  limiteDeCaracteres: { type: integer, example: 5000 }

  /health:
    get:
      tags: [Status]
      summary: Status e versão dos modelos
      responses:
        '200':
          description: Serviço no ar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /prever/texto:
    post:
      tags: [Previsão]
      summary: Probabilidade de uma mensagem ser golpe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [texto]
              properties:
                texto:
                  type: string
                  maxLength: 5000
                  example: 'URGENTE: seu PIX foi bloqueado. Regularize em itau-seguranca.xyz'
      responses:
        '200':
          description: Previsão do modelo de texto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrevisaoTexto' }
        '400':
          description: Corpo ausente, campo vazio ou acima de 5000 caracteres
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '500':
          description: Falha ao analisar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

  /prever/url:
    post:
      tags: [Previsão]
      summary: Probabilidade de um link ser phishing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  maxLength: 5000
                  example: http://itau-seguranca.xyz/login
      responses:
        '200':
          description: Previsão do modelo de URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrevisaoUrl' }
        '400':
          description: Corpo ausente, campo vazio ou acima de 5000 caracteres
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '500':
          description: Falha ao analisar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

components:
  schemas:
    Health:
      type: object
      properties:
        status: { type: string, example: ok }
        modelos:
          type: object
          properties:
            texto: { $ref: '#/components/schemas/InfoModelo' }
            url: { $ref: '#/components/schemas/InfoModelo' }

    InfoModelo:
      type: object
      properties:
        versao: { type: string, example: golpe_texto_v1 }
        algoritmo: { type: string, example: Regressão Logística }
        limiar: { type: number, example: 0.655 }

    PrevisaoTexto:
      type: object
      properties:
        modelo: { type: string, example: golpe_texto_v1 }
        probabilidadeGolpe: { type: number, format: float, example: 0.9731 }
        acimaDoLimiar: { type: boolean, example: true }
        sinaisTexto:
          type: array
          items:
            type: object
            properties:
              codigo:
                type: string
                enum: [URGENCIA, PEDE_PIX, PEDE_DADOS, AMEACA_BLOQUEIO, PREMIO, FINGE_PARENTE, LINK_ENCURTADO]
              evidencia: { type: string, example: URGENTE }
        linksEncontrados:
          type: array
          items: { type: string }
          example: [itau-seguranca.xyz]
        termosMaisRelevantes:
          type: array
          items: { type: string }
          example: [bloqueado, regularize, '[link]']

    PrevisaoUrl:
      type: object
      properties:
        modelo: { type: string, example: url_phishing_v1 }
        probabilidadePhishing: { type: number, format: float, example: 0.9912 }
        acimaDoLimiar: { type: boolean, example: true }
        featuresMaisRelevantes:
          type: array
          items:
            type: string
            enum: [encurtador, ip_no_lugar_do_dominio, dominio_de_terminacao_suspeita,
                   palavra_de_seguranca_ou_pagamento, hifen_no_dominio, sem_https,
                   muitos_subdominios, arquivo_executavel, muitos_numeros]
          example: [dominio_de_terminacao_suspeita, palavra_de_seguranca_ou_pagamento, hifen_no_dominio, sem_https]

    Erro:
      type: object
      properties:
        status: { type: integer, example: 400 }
        erro: { type: string, example: Requisição inválida }
        mensagem: { type: string, example: "O campo 'texto' é obrigatório." }
        caminho: { type: string, example: /prever/texto }
        timestamp: { type: string, format: date-time }
        campos:
          type: array
          items:
            type: object
            properties:
              campo: { type: string, example: texto }
              mensagem: { type: string, example: não pode ficar vazio }

